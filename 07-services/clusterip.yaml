# ClusterIP Service exposes the backend Pods only within the cluster
apiVersion: v1
kind: Service
metadata:
  name: backend-clusterip
  labels:
    app: backend
spec:
  # Type ClusterIP creates a stable internal cluster IP
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
