# LoadBalancer Service creates an external load balancer (cloud environments)
apiVersion: v1
kind: Service
metadata:
  name: backend-loadbalancer
  labels:
    app: backend
spec:
  # Type LoadBalancer allocates an external IP from the cloud provider
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
