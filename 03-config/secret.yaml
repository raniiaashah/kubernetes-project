# Kubernetes Secret - Stores sensitive data (base64 encoded)
# Note: Secrets are not encrypted by default - use encryption at rest for sensitive production data
apiVersion: v1
kind: Secret
metadata:
  # Name of the Secret resource
  name: app-secret
  # Namespace where this Secret will be stored
  namespace: prod

# Type of Secret - "Opaque" is the default for arbitrary user-defined data
type: Opaque

# Data field - contains key-value pairs with base64-encoded values
data:
  # Database password - must be base64 encoded
  # Example: echo -n 'mysecurepassword' | base64 -> bXlzZWN1cmVwYXNzd29yZA==
  database-password: bXlzZWN1cmVwYXNzd29yZA==
  
  # Database username - base64 encoded
  # Example: echo -n 'admin' | base64 -> YWRtaW4=
  database-username: YWRtaW4=
  
  # API key - base64 encoded
  # Example: echo -n 'your-api-key-here' | base64
  api-key: eW91ci1hcGkta2V5LWhlcmU=

# Alternative: stringData field - values are automatically base64 encoded (only in kubectl apply)
# Note: stringData is useful for storing plain text that will be auto-encoded
# stringData:
#   jwt-secret: your-jwt-secret-key
#   db-password: your-db-password

---
# Example: Docker Registry Secret (used for image pull)
apiVersion: v1
kind: Secret
metadata:
  name: docker-secret
  namespace: default

# Type for container registry authentication
type: kubernetes.io/dockercfg

# Data contains .dockercfg file content (base64 encoded)
data:
  .dockercfg: ewogICJhdXRocyI6IHsKICAgICJteS1yZWdpc3RyeS5jb20iOiB7CiAgICAgICJhdXRoIjogImJhc2U2NC1lbmNvZGVkLWNyZWRlbnRpYWxzIgogICAgfQogIH0KfQ==

---
# Example: TLS Secret (used for HTTPS certificates)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: default

# Type for TLS certificate and key
type: kubernetes.io/tls

# Data must contain "tls.crt" and "tls.key" keys
data:
  # TLS certificate (base64 encoded)
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t...
  
  # TLS private key (base64 encoded)
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t...
