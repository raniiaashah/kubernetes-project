# Kubernetes Secret - Stores sensitive data as plain text values encoded automatically
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: production

type: Opaque
stringData:
  database-password: mysecurepassword
  database-username: admin
  api-key: your-api-key-here

---
# Example: Docker Registry Secret (used for image pull)
apiVersion: v1
kind: Secret
metadata:
  name: docker-secret
  namespace: default

type: kubernetes.io/dockercfg
stringData:
  .dockercfg: |
    {
      "auths": {
        "my-registry.com": {
          "auth": "base64-encoded-auth-string"
        }
      }
    }

---
# Example: TLS Secret (used for HTTPS certificates)
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: default

type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_PEM_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_PEM_KEY
    -----END PRIVATE KEY-----
