# Ingress routes external HTTP(S) traffic to internal services
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  labels:
    app: frontend
  annotations:
    # Use this annotation if your Ingress controller supports it
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
  # Optional default backend for unmatched traffic
  #defaultBackend:
  #  service:
  #    name: frontend-service
  #    port:
  #      number: 80
# End of Ingress manifest
