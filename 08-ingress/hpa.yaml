# HorizontalPodAutoscaler for the ingress controller or frontend service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingress-hpa
  labels:
    app: ingress
spec:
  # Scale the Ingress controller Deployment
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
# End of HPA manifest for ingress
