# PersistentVolumeClaim manifest requesting storage from a PersistentVolume
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-data
  labels:
    app: pv-data
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-storage
  volumeName: pv-data
