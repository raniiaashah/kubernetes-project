# Frontend Deployment manifest for the user-provided frontend image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Container image specified by the user
          image: malikzohaib1482/frantend:backendimp1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          
          env:
            # Backend service URL for API calls
            - name: BACKEND_URL
              value: http://backend-service.default.svc.cluster.local:80
